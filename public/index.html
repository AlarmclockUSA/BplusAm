<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brilliant Plus Ambassador Program</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <script>
        window.stripePublishableKey = '<%= NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY %>';
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="bg-white rounded-lg shadow-lg p-6 md:p-8">
            <h1 class="text-3xl md:text-4xl font-bold text-center mb-8 text-gray-800">Brilliant Plus Ambassador Program</h1>
            
            <form id="payment-form" class="space-y-6">
                <div class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>

                    <div>
                        <label for="payment-element" class="block text-sm font-medium text-gray-700">Card Details</label>
                        <div id="payment-element" class="mt-1">
                            <!-- Stripe Elements will be inserted here -->
                        </div>
                    </div>
                </div>

                <div class="mt-6">
                    <button type="submit" id="submit-button" class="w-full bg-blue-600 text-white py-3 px-6 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        <span id="button-text">Pay Now</span>
                        <div id="spinner" class="hidden">
                            Processing...
                        </div>
                    </button>
                </div>

                <div id="payment-message" class="hidden mt-4 text-center text-sm"></div>
            </form>
        </div>
    </div>

    <script src="/script.js" defer></script>
</body>
</html>
